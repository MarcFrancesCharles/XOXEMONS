<video #bgVideo autoplay loop muted playsinline class="fons-animat" aria-hidden="true">
  <source src="/fondo_login.mp4" type="video/mp4">
</video>

<main style="max-width: 400px; margin: 50px auto; font-family: sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 8px;" aria-labelledby="register-title">
  <h1 id="register-title" style="text-align: center;">🎮 Registre de Xuxemons</h1>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 15px;" novalidate>
    
    <div>
      <label for="reg-name">Nom:</label><br>
      <input id="reg-name" type="text" formControlName="name" autocomplete="given-name" aria-required="true" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div>
      <label for="reg-surnames">Cognoms:</label><br>
      <input id="reg-surnames" type="text" formControlName="surnames" autocomplete="family-name" aria-required="true" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div>
      <label for="reg-email">Correu electrònic:</label><br>
      <input id="reg-email" type="email" formControlName="email" autocomplete="email" aria-required="true" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div>
      <label for="reg-password">Contrasenya:</label><br>
      <input id="reg-password" type="password" formControlName="password" autocomplete="new-password" aria-required="true" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div>
      <label for="reg-password-confirm">Repetir Contrasenya:</label><br>
      <input id="reg-password-confirm" type="password" formControlName="password_confirmation" autocomplete="new-password" aria-required="true" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    @if (errorMessage) {
      <div style="color: red; font-weight: bold; text-align: center;" role="alert" aria-live="assertive">
        {{ errorMessage }}
      </div>
    }

    <button type="submit" [disabled]="registerForm.invalid" style="padding: 10px; background-color: #4CAF50; color: white; cursor: pointer; border: none; border-radius: 4px; font-size: 16px;">
      Crear Jugador
    </button>
  </form>

  <p style="text-align: center; margin-top: 20px;">
    Ja tens un compte? <a routerLink="/login">Inicia sessió aquí</a>
  </p>
</main>
