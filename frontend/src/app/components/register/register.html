<video #bgVideo autoplay loop muted playsinline class="fons-animat" aria-hidden="true">
  <source src="/fondo_login.mp4" type="video/mp4">
</video>

<main class="register-container" aria-labelledby="register-title">
  <h1 id="register-title" class="register-title">🎮 Registre de Xuxemons</h1>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form" novalidate>
    
    <div class="form-group">
      <label for="reg-name">Nom:</label>
      <input id="reg-name" type="text" formControlName="name" placeholder="El teu nom" autocomplete="given-name" aria-required="true" class="pixel-input">
    </div>

    <div class="form-group">
      <label for="reg-surnames">Cognoms:</label>
      <input id="reg-surnames" type="text" formControlName="surnames" placeholder="Els teus cognoms" autocomplete="family-name" aria-required="true" class="pixel-input">
    </div>

    <div class="form-group">
      <label for="reg-email">Correu electrònic:</label>
      <input id="reg-email" type="email" formControlName="email" placeholder="example@mail.com" autocomplete="email" aria-required="true" class="pixel-input">
    </div>

    <div class="form-group">
      <label for="reg-password">Contrasenya:</label>
      <input id="reg-password" type="password" formControlName="password" placeholder="********" autocomplete="new-password" aria-required="true" class="pixel-input">
    </div>

    <div class="form-group">
      <label for="reg-password-confirm">Repetir Contrasenya:</label>
      <input id="reg-password-confirm" type="password" formControlName="password_confirmation" placeholder="********" autocomplete="new-password" aria-required="true" class="pixel-input">
    </div>

    @if (errorMessage) {
      <div class="error-message" role="alert" aria-live="assertive">
        {{ errorMessage }}
      </div>
    }

    <button type="submit" [disabled]="registerForm.invalid" class="pixel-button">
      Crear Jugador
    </button>
  </form>

  <p class="login-link">
    Ja tens un compte? <a routerLink="/login">Inicia sessió aquí</a>
  </p>
</main>
