<video #bgVideo autoplay loop muted playsinline class="fons-animat" aria-hidden="true">
  <source src="/MailBox.mp4" type="video/mp4">
</video>
<header>
  <nav class="retro-navbar" aria-label="Navegació del xat">
    <button routerLink="/friends" class="pixel-button btn-back">⬅️ Tornar als Amics</button>
    <h1 class="page-title">💬 Xat Privat</h1>
    <button routerLink="/main" class="pixel-button btn-blue">🏠 Main</button>
  </nav>
</header>

<main class="chat-container mt-4">
  <section class="chat-history" #chatScroll role="log" aria-live="polite" aria-atomic="false" aria-labelledby="chat-history-title">
    <h3 id="chat-history-title" class="sr-only">Historial de missatges</h3>
    
    @for (msg of messages; track msg.id) {
      <div class="message-wrapper" [ngClass]="msg.sender_id === myId ? 'mine' : 'theirs'">
        
        <span class="sr-only">
          Missatge de {{ msg.sender_id === myId ? 'Tu' : 'Amic' }}:
        </span>

        <div class="message-bubble">
          {{ msg.content }}
          <span class="timestamp">{{ timeAgo(msg.created_at) }}</span>
        </div>
      </div>
    } @empty {
      <p class="text-center text-muted mt-4">No teniu cap missatge. Trenca el gel! 🧊🔨</p>
    }

  </section>

  <section class="chat-input-area" aria-label="Àrea d'enviament de missatges">
    <input type="text" 
           [(ngModel)]="newMessage" 
           (keyup.enter)="sendMessage()" 
           placeholder="Escriu un missatge..." 
           class="pixel-input full-width"
           aria-label="Camp de text per escriure un missatge">
    
    <button class="pixel-button btn-green" (click)="sendMessage()">Enviar</button>
  </section>
</main>
